<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>我的成长行动台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" title="双击：数据管理">我的成长行动台</div>
    <div class="top-right">
      <button class="today-pill" id="topDate"></button>
      <span class="sync-dot" id="syncDot" title="云同步状态"></span>
      <button class="today-pill" id="backToday" hidden>今天</button>
    </div>
  </header>
  <main id="view"><p style="color:#8a8579;text-align:center;padding:40px 16px;font-size:14px">正在加载…<br><br>如果这里长时间空白，说明浏览器/预览拦截了脚本。<br>请直接双击本文件打开。</p></main>
  <nav class="tabbar">
    <button class="tab" data-view="home"><span class="ti">◈</span><span>行动台</span></button>
    <button class="tab" data-view="pool"><span class="ti">✿</span><span>探索池</span></button>
    <button class="tab" data-view="projects"><span class="ti">▣</span><span>项目库</span></button>
    <button class="tab" data-view="records"><span class="ti">☰</span><span>记录</span></button>
    <button class="tab" data-view="summary"><span class="ti">▦</span><span>汇总</span></button>
  </nav>
</div>
<div id="modal" class="modal-mask" hidden>
  <div class="modal">
    <div class="modal-head"><span id="modalTitle"></span><button class="modal-x" id="modalX">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
