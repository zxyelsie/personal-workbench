<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>我的成长行动台</title>
<style>
:root{
  --bg:#f4f1ea;
  --card:#ffffff;
  --ink:#33302a;
  --muted:#8a8579;
  --line:#ece8df;
  --accent:#6f8f6a;
  --accent-soft:#e7eee4;
  --warn:#c98a5e;
  --warn-soft:#f6e9df;
  --career:#6f8f6a;
  --ai:#5b8aa6;
  --life:#c98a5e;
  --other:#9a8fae;
  --radius:16px;
  --shadow:0 2px 10px rgba(60,50,30,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
.brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.today-pill{font-size:12px;color:var(--accent);background:var(--accent-soft);
  padding:4px 12px;border-radius:999px;font-weight:600}

#view{flex:1;padding:6px 14px 90px;overflow-y:auto}

/* reminder banner */
.reminder{background:linear-gradient(135deg,#eef3ec,#f6efe6);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin:6px 0 14px;box-shadow:var(--shadow)}
.reminder .r-title{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.reminder .r-text{font-size:14px;color:var(--ink);line-height:1.6}

.anx-banner{background:var(--warn-soft);border:1px solid #f0d8c4;
  border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;font-size:13.5px;color:#7a5234}
.anx-actions{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.anx-btn{background:#fff;border:1px solid #ecd9c8;color:#7a5234;
  border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer}

/* section */
.sec{margin:18px 0 6px;display:flex;align-items:center;justify-content:space-between}
.sec h3{margin:0;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:1px}
.sec .count{font-size:12px;color:var(--muted)}

/* action item */
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin:8px 0;box-shadow:var(--shadow);position:relative}
.act.done{opacity:.62}
.act-top{display:flex;align-items:flex-start;gap:10px}
.act-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);
  flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:#fff;font-size:14px;font-weight:700;margin-top:1px}
.act-check.on{background:var(--accent)}
.act-main{flex:1;min-width:0}
.act-content{font-size:15px;word-break:break-word}
.act.done .act-content{text-decoration:line-through}
.act-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.src{background:#eef0f3;color:#6b7280}
.tag.due{background:var(--warn-soft);color:var(--warn)}
.tag.proj{background:#efeaf6;color:var(--other)}
.tag.ach{background:#fbeecb;color:#9a7b1f}
.status-pill{font-size:11px;padding:2px 9px;border-radius:999px;cursor:pointer;border:1px solid var(--line)}
.st-想法{background:#f0f0f0;color:#888}
.st-待安排{background:#eaf0f4;color:#5b8aa6}
.st-进行中{background:#e7eee4;color:#6f8f6a}
.st-已完成{background:#e8e8e8;color:#999}
.st-暂停{background:#f6e9df;color:#c98a5e}

.act-menu{position:absolute;top:10px;right:10px}
.act-menu button{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
.act-sub{font-size:12px;color:var(--muted);margin-top:5px}

.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 10px;
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}

/* big add button */
.fab{position:fixed;right:18px;bottom:74px;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:26px;line-height:1;
  box-shadow:0 4px 14px rgba(80,110,70,.35);z-index:15;cursor:pointer}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;
  display:flex;background:#fff;border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:none;padding:9px 0 7px;display:flex;flex-direction:column;
  align-items:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer}
.tab .ti{font-size:18px;line-height:1}
.tab.active{color:var(--accent)}

/* pool */
.pool-cat{margin:14px 0 4px}
.pool-cat h4{margin:0 0 6px;font-size:13px;color:var(--accent);font-weight:700}
.pool-item{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin:6px 0;font-size:14px}
.pool-add{background:var(--accent-soft);color:var(--accent);border:none;border-radius:8px;
  padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.link-add{background:none;border:1px dashed var(--accent);color:var(--accent);
  border-radius:10px;padding:7px 10px;width:100%;font-size:13px;cursor:pointer;margin-top:6px}

/* projects */
.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-name{font-size:16px;font-weight:700}
.proj-goal{font-size:13px;color:var(--muted);margin-top:3px}
.proj-meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar > i{display:block;height:100%;background:var(--accent)}
.step{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-of-type{border-top:none}
.step .chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--accent);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.step .chk.on{background:var(--accent)}
.step .txt{flex:1}
.step.done .txt{text-decoration:line-through;color:var(--muted)}
.proj-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  font-size:12px;color:var(--ink);cursor:pointer}
.mini.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* records */
.tabs2{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tabs2 button{background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs2 button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rec-date{font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 4px;letter-spacing:.5px}
.rec{display:flex;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;margin:6px 0}
.rec .rdir{font-size:11px;font-weight:700;flex:none;padding:2px 7px;border-radius:6px;height:fit-content}
.rec .rbody{flex:1;min-width:0}
.rec .rcontent{font-size:14px}
.rec .rmeta{font-size:11.5px;color:var(--muted);margin-top:3px}
.raction{color:var(--accent);font-size:12px;cursor:pointer;margin-right:12px}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.report h4{margin:0 0 8px;font-size:14px}
.kpis{display:flex;gap:8px;margin:8px 0}
.kpi{flex:1;text-align:center;background:var(--accent-soft);border-radius:12px;padding:10px 4px}
.kpi .n{font-size:20px;font-weight:800;color:var(--accent)}
.kpi .l{font-size:11px;color:var(--muted)}
.report ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.report li{margin:3px 0}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(40,35,25,.45);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;
  max-height:88vh;display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:16px 18px 8px;font-size:16px;font-weight:700}
.modal-x{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
.modal-body{padding:6px 18px 22px;overflow-y:auto}
.field{margin:12px 0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;font-family:inherit;background:#faf8f3;color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.pick-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pick{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font-size:13.5px;cursor:pointer}
.pick.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.src-group{margin:10px 0}
.src-group h5{margin:6px 0;font-size:13px;color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:rgba(40,35,25,.9);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;z-index:60;max-width:80%}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">我的成长行动台</div>
    <div class="top-right">
      <span class="today-pill" id="topDate"></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab" data-view="home"><span class="ti">◈</span><span>行动台</span></button>
    <button class="tab" data-view="pool"><span class="ti">✿</span><span>探索池</span></button>
    <button class="tab" data-view="projects"><span class="ti">▣</span><span>项目库</span></button>
    <button class="tab" data-view="records"><span class="ti">☰</span><span>记录</span></button>
  </nav>
</div>

<div id="modal" class="modal-mask" hidden>
  <div class="modal">
    <div class="modal-head"><span id="modalTitle"></span><button class="modal-x" id="modalX">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
/* ============ 个人成长行动台 V2 ============ */
const STORE_KEY = 'growth_workbench_v2';
const OLD_KEY = 'growth_workbench_v1';

const DIRS = { career:'职业', ai:'AI', life:'生活', other:'其他' };
const DIR_COLOR = { career:'var(--career)', ai:'var(--ai)', life:'var(--life)', other:'var(--other)' };
const STATUSES = ['想法','待安排','进行中','已完成','暂停'];

/* 今日提醒：每天轮换展示一条，降低焦虑、增加行动反馈 */
const TODAY_REMINDERS = [
  '今天不需要解决所有问题，只需要推进一个小步骤。',
  '记录不是为了监督自己，而是为了看见自己已经在前进。',
  '想法很多不是问题，先选择一个行动即可。',
  '不需要等准备完美再开始，先做出第一个版本。',
  '生活不是项目管理，不需要每一天都有成果。',
  '今天完成一点，就是积累。',
  '重要的不是做得多，而是你真的动了一步。',
  '把期待放进探索池，把今天留给一个行动。'
];
/* 焦虑提醒 */
const ANX = {
  many: '看到很多想做的事情，说明你对生活有期待，不代表你落后。今天只需要选择当前最重要的一件。',
  nothing: '回顾已经完成的事情，而不是只看未完成列表。你已经走过的路，比想象的更多。',
  redesign: '先使用 7 天，再优化。真实体验比完美设计更有价值。'
};

/* ---------- 种子：探索池 ---------- */
function seedPool(){
  return {
    ai: ['测试一个新的 AI 工具','看一个 GitHub 项目','用 AI 解决一个工作痛点','优化已有 AI 工具','做一个小 Demo','研究一个 AI 应用案例'],
    career: [
      '看 3 个采购经理岗位','分析岗位关键词','收藏匹配岗位','优化一个简历模块','准备一个面试案例',
      '整理一个采购案例','总结一次流程优化经验','梳理供应商治理方法','沉淀采购管理框架',
      '记录一个工作痛点','优化一个流程','找一个 AI 应用场景','总结一次问题解决过程'
    ],
    life: [
      '做一个新面包','改良一个配方','做一次主题晚餐',
      '优化一个房间角落','研究一个提升生活质量的小物','设计未来独居空间',
      '去一个没去过的地方','找一家特色店','一个下午随机探索',
      '陶艺体验','看一次展览','逛一次市集','做一次手作','看一场脱口秀','体验一种新运动'
    ]
  };
}
/* ---------- 种子：项目库 ---------- */
function seedProjects(){
  return [
    { id:uid(), name:'AI 个人成长工作台', goal:'搭建适合自己的个人行动反馈系统', stage:'V1 完成',
      status:'进行中', steps:[
        {id:uid(),content:'调整每日页面',status:'已完成'},
        {id:uid(),content:'优化任务池',status:'已完成'},
        {id:uid(),content:'增加自动总结',status:'待安排'},
        {id:uid(),content:'根据反馈迭代',status:'待安排'}
      ]},
    { id:uid(), name:'AI 采购应用探索', goal:'形成 1-2 个 AI+采购应用案例', stage:'收集痛点中',
      status:'进行中', steps:[
        {id:uid(),content:'收集 3 个采购痛点',status:'待安排'},
        {id:uid(),content:'选择一个简单场景',status:'待安排'},
        {id:uid(),content:'查询已有 AI/开源工具',status:'待安排'},
        {id:uid(),content:'写一页需求',status:'待安排'},
        {id:uid(),content:'搭建 Demo',status:'待安排'},
        {id:uid(),content:'记录反馈并沉淀案例',status:'待安排'}
      ]},
    { id:uid(), name:'职业资产库', goal:'把 8 年经验转化为可展示能力', stage:'列清单',
      status:'进行中', steps:[
        {id:uid(),content:'列 10 个值得讲的项目',status:'待安排'},
        {id:uid(),content:'选择优先案例',status:'待安排'},
        {id:uid(),content:'写背景 / 行动 / 结果',status:'待安排'},
        {id:uid(),content:'形成面试素材',status:'待安排'}
      ]},
    { id:uid(), name:'生活体验扩容', goal:'打破“上班—运动—在家”的固定轨道', stage:'建清单',
      status:'进行中', steps:[
        {id:uid(),content:'建立体验候选清单',status:'待安排'},
        {id:uid(),content:'每周挑一个小体验',status:'待安排'},
        {id:uid(),content:'每月至少完成 2 次新体验',status:'待安排'},
        {id:uid(),content:'记录值得再次尝试的体验',status:'待安排'}
      ]}
  ];
}

/* ---------- 工具 ---------- */
function uid(){ return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return (m[0]==='0'?m[1]:m)+'月'+(day[0]==='0'?day[1]:day)+'日'; }
function isBefore(a,b){ return a && b && a < b; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }
function $(s,r=document){ return r.querySelector(s); }
function $all(s,r=document){ return Array.from(r.querySelectorAll(s)); }

/* ---------- 存储 + v1 迁移 ---------- */
function freshState(){
  return { version:2, pool:seedPool(), projects:seedProjects(), actions:[], settings:{} };
}
function migrateV1(){
  try{
    const raw=localStorage.getItem(OLD_KEY); if(!raw) return null;
    const o=JSON.parse(raw); const st=freshState();
    // 历史 -> 已完成行动
    (o.history||[]).forEach(r=>{
      st.actions.push({ id:uid(), content:r.content, dir:r.dir||'other', source:r.projectId?'项目':'临时想法',
        plannedDate:r.date, dueDate:null, status:r.done?'已完成':'待安排', projectId:r.projectId||null,
        createdAt:r.date, completedAt:r.completedAt||null, feedback:r.feedback||'', isAchievement:!!r.isAchievement });
    });
    // 今日未完成项 -> 行动
    (o.today&&o.today.items||[]).forEach(it=>{
      if(it.done) return;
      st.actions.push({ id:uid(), content:it.text, dir:it.dir||'other', source:it.projectId?'项目':'临时想法',
        plannedDate:o.today.date, dueDate:null, status:'待安排', projectId:it.projectId||null,
        createdAt:o.today.date, completedAt:null, feedback:'', isAchievement:false });
    });
    if(o.projects) st.projects=o.projects;
    return st;
  }catch(e){ return null; }
}
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const s=JSON.parse(raw); if(!s.actions) s.actions=[]; return s; } }catch(e){}
  const m=migrateV1(); if(m){ return m; }
  return freshState();
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = load();

/* ---------- 当前视图 ---------- */
let view = 'home';
let recTab = 'all';
let recFilter = 'all';

function go(v){ view=v; render(); }
function render(){
  $('#topDate').textContent = dateLabel(todayStr());
  const v=$('#view');
  if(view==='home') v.innerHTML=renderHome();
  else if(view==='pool') v.innerHTML=renderPool();
  else if(view==='projects') v.innerHTML=renderProjects();
  else if(view==='records') v.innerHTML=renderRecords();
  $all('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
  window.scrollTo(0,0);
}

/* ================= 首页：我的行动台 ================= */
function renderHome(){
  const t = todayStr();
  const actions = state.actions;
  const todayItems = actions.filter(a=>a.plannedDate===t && a.status!=='已完成');
  const overdue = actions.filter(a=>isBefore(a.plannedDate,t) && a.status!=='已完成');
  const upcoming = actions.filter(a=>isBefore(t,a.plannedDate) && a.status!=='已完成').sort((x,y)=>x.plannedDate<y.plannedDate?-1:1);
  const activeNoDate = actions.filter(a=>!a.plannedDate && a.status==='进行中');
  const doneToday = actions.filter(a=>a.status==='已完成' && a.completedAt && a.completedAt.slice(0,10)===t);

  const reminder = TODAY_REMINDERS[(dayOfYear()%TODAY_REMINDERS.length)];
  let html = `
    <div class="reminder">
      <div class="r-title">今日提醒</div>
      <div class="r-text">${reminder}</div>
    </div>`;

  if(todayItems.length>=5){
    html += `<div class="anx-banner">${ANX.many}</div>`;
  }

  // 今日行动
  html += `<div class="sec"><h3>今日行动</h3><span class="count">${todayItems.length} 项</span></div>`;
  if(todayItems.length===0) html += `<div class="empty">今天还没有安排。点右下角 + ，从探索池、项目下一步或自己的念头里，挑一件就好。</div>`;
  else html += todayItems.map(a=>actCard(a)).join('');

  // 逾期（温和提示）
  if(overdue.length){
    html += `<div class="sec"><h3>还没做的（之前计划）</h3><span class="count">${overdue.length} 项</span></div>`;
    html += overdue.map(a=>actCard(a)).join('');
  }
  // 进行中（无日期）
  if(activeNoDate.length){
    html += `<div class="sec"><h3>进行中</h3></div>`;
    html += activeNoDate.map(a=>actCard(a)).join('');
  }
  // 即将到来
  if(upcoming.length){
    html += `<div class="sec"><h3>即将到来</h3><span class="count">${upcoming.length} 项</span></div>`;
    html += upcoming.map(a=>actCard(a)).join('');
  }

  // 今日完成（完成感）
  if(doneToday.length){
    html += `<div class="sec"><h3>今天已完成</h3><span class="count">${doneToday.length} 件 ✓</span></div>`;
    html += doneToday.map(a=>actCard(a,true)).join('');
  }

  // 焦虑急救
  html += `<div class="anx-actions">
    <button class="anx-btn" data-act="anx-nothing">我觉得什么都没做</button>
    <button class="anx-btn" data-act="anx-redesign">想重新设计系统</button>
  </div>`;

  return html;
}
function dayOfYear(){ const d=new Date(); const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }

function actCard(a, doneReadonly){
  const done = a.status==='已完成';
  const srcTag = a.source?`<span class="tag src">${escapeHtml(a.source)}</span>`:'';
  const proj = a.projectId? state.projects.find(p=>p.id===a.projectId):null;
  const projTag = proj?`<span class="tag proj">${escapeHtml(proj.name)}</span>`:'';
  const dueTag = a.dueDate?`<span class="tag due">${dateLabel(a.dueDate)}前</span>`:'';
  const achTag = a.isAchievement?`<span class="tag ach">成果</span>`:'';
  const sub = [];
  if(a.plannedDate && a.plannedDate!==todayStr()) sub.push('计划 '+dateLabel(a.plannedDate));
  if(a.feedback) sub.push('反馈：'+a.feedback);
  return `<div class="act ${done?'done':''}" data-id="${a.id}">
    <div class="act-top">
      <div class="act-check ${done?'on':''}" data-act="toggle" data-id="${a.id}">${done?'✓':''}</div>
      <div class="act-main">
        <div class="act-content">${escapeHtml(a.content)}</div>
        <div class="act-tags">${srcTag}${projTag}${dueTag}${achTag}
          <span class="status-pill st-${a.status}" data-act="cycle-status" data-id="${a.id}">${a.status}</span>
        </div>
        ${sub.length?`<div class="act-sub">${escapeHtml(sub.join(' · '))}</div>`:''}
      </div>
      <div class="act-menu"><button data-act="menu" data-id="${a.id}">⋯</button></div>
    </div>
  </div>`;
}

/* ================= 项目库 ================= */
function renderProjects(){
  if(state.projects.length===0) return `<div class="empty">还没有项目。项目是“长期一点的事”。点右下角 + 新建一个。</div>`;
  return state.projects.map(proj=>{
    const total=proj.steps.length;
    const done=proj.steps.filter(s=>s.status==='已完成').length;
    const pct= total? Math.round(done/total*100):0;
    const next=proj.steps.find(s=>s.status!=='已完成');
    const steps=proj.steps.map(s=>`<div class="step ${s.status==='已完成'?'done':''}">
      <div class="chk ${s.status==='已完成'?'on':''}" data-act="step-toggle" data-pid="${proj.id}" data-sid="${s.id}">${s.status==='已完成'?'✓':''}</div>
      <div class="txt">${escapeHtml(s.content)} <span class="status-pill st-${s.status}" data-act="step-status" data-pid="${proj.id}" data-sid="${s.id}">${s.status}</span></div>
    </div>`).join('');
    return `<div class="proj">
      <div class="proj-head"><div><div class="proj-name">${escapeHtml(proj.name)}</div>
        <div class="proj-goal">${escapeHtml(proj.goal||'')}</div></div>
        <span class="status-pill st-${proj.status}" data-act="proj-status" data-pid="${proj.id}">${proj.status}</span></div>
      <div class="proj-meta"><span>阶段：${escapeHtml(proj.stage||'—')}</span><span>进度 ${done}/${total}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${steps}
      <div class="proj-actions">
        ${next?`<button class="mini acc" data-act="step-to-today" data-pid="${proj.id}" data-sid="${next.id}">把下一步加入今日</button>`:''}
        <button class="mini" data-act="proj-add-step" data-pid="${proj.id}">+ 拆解动作</button>
        <button class="mini" data-act="proj-edit" data-pid="${proj.id}">编辑</button>

}

/* ================= 记录 + 周报月报成果（整合层）================= */
function renderRecords(){
  let html=`<div class="tabs2">
    <button class="${recTab==='all'?'on':''}" data-act="rectab" data-t="all">全部记录</button>
    <button class="${recTab==='week'?'on':''}" data-act="rectab" data-t="week">周报</button>
    <button class="${recTab==='month'?'on':''}" data-act="rectab" data-t="month">月报</button>
    <button class="${recTab==='ach'?'on':''}" data-act="rectab" data-t="ach">成果</button>
  </div>`;

  if(recTab==='week'){ html+=renderWeek(); }
  else if(recTab==='month'){ html+=renderMonth(); }
  else if(recTab==='ach'){ html+=renderAch(); }
  else { html+=renderAllRecords(); }
  return html;
}
function renderAllRecords(){
  const done = state.actions.filter(a=>a.status==='已完成').slice().sort((x,y)=>(y.completedAt||'').localeCompare(x.completedAt||''));
  let html=`<div class="sec"><h3>全部完成记录</h3><span class="count">共 ${done.length} 条 · 跨所有日期</span></div>`;
  const filters=['all','career','ai','life','other'];
  html+=`<div class="tabs2">`+filters.map(f=>`<button class="${recFilter===f?'on':''}" data-act="recfilter" data-f="${f}">${f==='all'?'全部':DIRS[f]}</button>`).join('')+`</div>`;
  const list=done.filter(a=>recFilter==='all'||a.dir===recFilter);
  if(list.length===0){ html+=`<div class="empty">还没有完成记录。去行动台勾选一件吧。</div>`; return html; }
  // 按日期分组
  const groups={};
  list.forEach(a=>{ const d=(a.completedAt||'').slice(0,10)||a.plannedDate||'未知'; (groups[d]=groups[d]||[]).push(a); });
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(d=>{
    html+=`<div class="rec-date">${dateLabel(d)}（${d}）</div>`;
    groups[d].forEach(a=>html+=recRow(a));
  });
  return html;
}
function recRow(a){
  const proj=a.projectId?state.projects.find(p=>p.id===a.projectId):null;
  return `<div class="rec">
    <span class="rdir" style="background:${DIR_COLOR[a.dir]}22;color:${DIR_COLOR[a.dir]}">${DIRS[a.dir]||a.dir}</span>
    <div class="rbody">
      <div class="rcontent">${escapeHtml(a.content)} ${a.isAchievement?'<span class="tag ach">成果</span>':''}</div>
      <div class="rmeta">${a.completedAt?a.completedAt.slice(11,16):''} ${proj?'· '+escapeHtml(proj.name):''} ${a.source?'· '+escapeHtml(a.source):''}</div>
      ${a.feedback?`<div class="rmeta">反馈：${escapeHtml(a.feedback)}</div>`:''}
      <div style="margin-top:4px">
        ${a.isAchievement?'':`<span class="raction" data-act="mark-ach" data-id="${a.id}">标记为成果 ›</span>`}
        <span class="raction" data-act="edit-feedback" data-id="${a.id}">写反馈</span>
      </div>
    </div>
  </div>`;
}
function renderWeek(){
  const t=new Date(); const dow=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-dow);
  const start=mon.toISOString().slice(0,10); const sun=new Date(mon); sun.setDate(mon.getDate()+7);
  const end=sun.toISOString().slice(0,10);
  const done=state.actions.filter(a=>a.status==='已完成'&&a.completedAt>=start&&a.completedAt<end);
  const cnt={career:0,ai:0,life:0,other:0}; done.forEach(a=>cnt[a.dir]++);
  let html=`<div class="report"><h4>本周完成（${dateLabel(start)} – ${dateLabel(end)}）</h4>
    <div class="kpis">${['career','ai','life','other'].map(k=>`<div class="kpi"><div class="n">${cnt[k]}</div><div class="l">${DIRS[k]}</div></div>`).join('')}</div>
    <ul>${done.length?done.map(a=>`<li>${escapeHtml(a.content)} <span style="color:var(--muted)">（${DIRS[a.dir]}）</span></li>`).join(''):'<li>本周还没有完成，挑一件开始吧。</li>'}</ul>`;
  // 项目进展
  const prog=state.projects.map(p=>{ const d=p.steps.filter(s=>s.status==='已完成').length; return {n:p.name,d,t:p.steps.length}; }).filter(x=>x.t>0);
  if(prog.length){ html+=`<h4 style="margin-top:10px">项目进展</h4><ul>`+prog.map(x=>`<li>${escapeHtml(x.n)}：${x.d}/${x.t}</li>`).join('')+`</ul>`; }
  html+=`</div>`;
  return html;
}
function renderMonth(){
  const t=new Date(); const ym=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  const done=state.actions.filter(a=>a.status==='已完成'&&(a.completedAt||'').slice(0,7)===ym);
  const cnt={career:0,ai:0,life:0,other:0}; done.forEach(a=>cnt[a.dir]++);
  const ach=state.actions.filter(a=>a.isAchievement);
  const finishedProj=state.projects.filter(p=>p.steps.length&&p.steps.every(s=>s.status==='已完成'));
  let html=`<div class="report"><h4>${t.getMonth()+1} 月小结</h4>
    <div class="kpis">${['career','ai','life','other'].map(k=>`<div class="kpi"><div class="n">${cnt[k]}</div><div class="l">${DIRS[k]}</div></div>`).join('')}</div>
    <ul>
      <li>完成行动共 <b>${done.length}</b> 件</li>
      <li>累计成果 <b>${ach.length}</b> 个</li>
      <li>已做完的小项目 <b>${finishedProj.length}</b> 个</li>
      <li>生活新体验 ${cnt.life} 次 · AI 实践 ${cnt.ai} 次 · 职业推进 ${cnt.career} 次</li>
    </ul>
    <p style="font-size:13px;color:var(--muted);margin:8px 0 0">这个月你其实做了不少事。继续，不急。</p></div>`;
  return html;
}
function renderAch(){
  const ach=state.actions.filter(a=>a.isAchievement);
  if(ach.length===0) return `<div class="empty">还没有标记成果。在“全部记录”里，把值得沉淀的完成项标记为成果。</div>`;
  return ach.map(a=>`<div class="report">
    <h4>${escapeHtml(a.content)}</h4>
    <div class="rmeta" style="color:var(--muted);font-size:12px">${dateLabel((a.completedAt||'').slice(0,10))} · ${DIRS[a.dir]}</div>
    ${a.achDetail?`<div style="font-size:13.5px;margin-top:6px;white-space:pre-wrap">${escapeHtml(a.achDetail)}</div>`:''}

  </div>`).join('');
}

/* ================= 动作：行动台 CRUD ================= */
function addAction(obj){
  state.actions.push(Object.assign({ id:uid(), source:'临时想法', dir:'other', plannedDate:todayStr(),
    dueDate:null, status:'待安排', projectId:null, createdAt:todayStr(), completedAt:null, feedback:'', isAchievement:false }, obj));
  save(); render();
}
function getAction(id){ return state.actions.find(a=>a.id===id); }
function toggleAction(id){
  const a=getAction(id); if(!a) return;
  if(a.status==='已完成'){ a.status='待安排'; a.completedAt=null; }
  else { a.status='已完成'; a.completedAt=new Date().toISOString(); }
  save(); render();
}
function cycleStatus(id){
  const a=getAction(id); if(!a) return;
  let i=STATUSES.indexOf(a.status); i=(i+1)%STATUSES.length; a.status=STATUSES[i];
  if(a.status==='已完成'&&!a.completedAt) a.completedAt=new Date().toISOString();
  if(a.status!=='已完成') a.completedAt=null;
  save(); render();
}
function deleteAction(id){ state.actions=state.actions.filter(a=>a.id!==id); save(); render(); }

    const status=($('#p-status .pick.on')||{}).dataset?.v||'进行中';
    if(p){ Object.assign(p,{name,goal:$('#p-goal').value.trim(),stage:$('#p-stage').value.trim(),status}); }
    else { state.projects.push({id:uid(),name,goal:$('#p-goal').value.trim(),stage:$('#p-stage').value.trim(),status,steps:[]}); }
    save(); closeModal(); render();
  });
  if(p) $('#p-del').addEventListener('click',()=>{ if(confirm('删除项目？其步骤会一起移除。')){ state.projects=state.projects.filter(x=>x.id!==pid); save(); closeModal(); render(); } });
}
function openAddStep(pid){
  openModal('拆解动作', `
    <div class="field"><label>动作（动词 + 明确产出）</label><textarea id="s-content" placeholder="例如：收集 3 个采购痛点"></textarea></div>
    <button class="btn" id="s-save">添加</button>`);
  $('#s-save').addEventListener('click',()=>{
    const c=$('#s-content').value.trim(); if(!c){toast('填点什么');return;}
    const p=state.projects.find(x=>x.id===pid); if(!p) return;
    p.steps.push({id:uid(),content:c,status:'待安排'}); save(); closeModal(); render();
  });
}

/* ================= 探索池动作 ================= */
function poolAdd(key,i){
  const it=poolItem(key,i); if(!it) return;
  addAction({ content:it, dir:poolDir(key), source:'探索池', plannedDate:todayStr(), status:'待安排' });
  toast('已加入今日行动台');
}
function poolNew(key){
  openModal('添加探索项', `<div class="field"><label>想以后可能做的事</label><textarea id="pn-c"></textarea></div>
    <button class="btn" id="pn-save">添加到探索池</button>`);
  $('#pn-save').addEventListener('click',()=>{ const c=$('#pn-c').value.trim(); if(!c){toast('填点什么');return;}
    state.pool[key].push(c); save(); closeModal(); render(); toast('已加入探索池'); });
}

/* ================= 成果 / 反馈 ================= */
function markAch(id){
  const a=getAction(id); if(!a) return;
  openModal('标记为成果', `
    <p style="color:var(--muted);font-size:13px">成果类型会按方向归类。补充一句它有什么用：</p>
    <div class="field"><label>成果说明（背景 / 做了什么 / 结果 / 后续用途）</label><textarea id="ach-d">${escapeHtml(a.achDetail||'')}</textarea></div>
    <button class="btn" id="ach-save">保存为成果</button>`);
  $('#ach-save').addEventListener('click',()=>{ a.isAchievement=true; a.achDetail=$('#ach-d').value.trim(); if(a.status!=='已完成'){a.status='已完成';a.completedAt=new Date().toISOString();} save(); closeModal(); render(); toast('已沉淀为成果'); });
}
function editAch(id){ markAch(id); }
function editFeedback(id){
  const a=getAction(id); if(!a) return;
  openModal('写反馈', `<div class="field"><label>简短反馈（可选）</label><textarea id="fb-c">${escapeHtml(a.feedback||'')}</textarea></div>
    <button class="btn" id="fb-save">保存</button>`);
  $('#fb-save').addEventListener('click',()=>{ a.feedback=$('#fb-c').value.trim(); save(); closeModal(); render(); toast('已保存'); });
}

/* ================= 导出 / 导入 ================= */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='成长行动台备份_'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(url); toast('已导出备份');
}
function importData(){
  openModal('导入备份', `<p style="color:var(--muted);font-size:13px">选择一个之前导出的 JSON 备份。会覆盖当前数据。</p>
    <input type="file" id="imp-f" accept="application/json">
    <button class="btn" id="imp-go" style="margin-top:10px">导入</button>`);
  $('#imp-go').addEventListener('click',()=>{ const f=$('#imp-f').files[0]; if(!f){toast('先选文件');return;}
    const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); state=Object.assign(freshState(),s); save(); closeModal(); render(); toast('导入成功'); }catch(e){ toast('文件格式不对'); } }; r.readAsText(f); });
}

/* ================= 事件委托 ================= */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(el){ handleAct(el.dataset.act, el); return; }
  // 底部导航
  const tab=e.target.closest('.tab'); if(tab){ go(tab.dataset.view); return; }
});
function handleAct(act, el){
  const id=el.dataset.id;
  switch(act){
    case 'toggle': toggleAction(id); break;
    case 'cycle-status': cycleStatus(id); break;
    case 'menu': openMenu(id); break;
    case 'anx-nothing':{ const n=state.actions.filter(a=>a.status==='已完成').length;
      openModal('你已经做了这些',`<p style="font-size:14px;line-height:1.7">${ANX.nothing}</p>
        <p style="color:var(--muted)">目前累计已完成 <b>${n}</b> 件行动。回顾它们，而不是盯着未完成列表。</p>`); break; }
    case 'anx-redesign': openModal('关于重新设计',`<p style="font-size:14px;line-height:1.7">${ANX.redesign}</p>`); break;
    // 探索池
    case 'pool-add': poolAdd(el.dataset.key, +el.dataset.i); break;
    case 'pool-new': poolNew(el.dataset.key); break;
    case 'pool-pick': closeModal(); poolAdd(el.dataset.key, +el.dataset.i); break;
    // 项目
    case 'step-toggle': toggleStep(el.dataset.pid, el.dataset.sid); break;
    case 'step-status': cycleStepStatus(el.dataset.pid, el.dataset.sid); break;
    case 'step-to-today': stepToToday(el.dataset.pid, el.dataset.sid); break;
    case 'proj-status': projStatus(el.dataset.pid); break;
    case 'proj-add-step': openAddStep(el.dataset.pid); break;
    case 'proj-edit': openProjEdit(el.dataset.pid); break;
    case 'proj-pick':{ const arr=window.__projPick||[]; const it=arr[+el.dataset.idx]; if(it){ closeModal(); stepToToday(it.pid,it.sid);} break; }
    // 记录
    case 'rectab': recTab=el.dataset.t; render(); break;
    case 'recfilter': recFilter=el.dataset.f; render(); break;
    case 'mark-ach': markAch(id); break;
    case 'edit-ach': editAch(id); break;
    case 'edit-feedback': editFeedback(id); break;
    // 模态内
    case 'add-self': openSelfForm(); break;
    case 'add-from-pool': openPoolPicker(); break;
    case 'add-from-proj': openProjPicker(); break;
    case 'm-edit': closeModal(); openEditForm(id); break;
    case 'm-status': cycleStatus(id); closeModal(); break;
    case 'm-ach': markAch(id); break;
    case 'm-fb': editFeedback(id); break;
    case 'm-del': if(confirm('删除这条行动？')){ deleteAction(id); closeModal(); } break;
  }
}

/* FAB：右下角 + */
const fab=document.createElement('button'); fab.className='fab'; fab.textContent='+'; fab.addEventListener('click', openAddMenu);
document.getElementById('app').appendChild(fab);

/* 顶部长按标题 -> 数据管理（导出/导入）*/
$('#topDate').parentElement.addEventListener('dblclick', ()=>{
  openModal('数据管理', `<p style="color:var(--muted);font-size:13px">数据保存在本浏览器。换设备时导出处备份，再在另一台导入。</p>
    <button class="btn" id="ex-go">⬇ 导出备份（JSON）</button>
    <button class="btn ghost" id="im-go" style="margin-top:8px">⬆ 导入备份</button>
    <button class="btn ghost" id="reset-go" style="margin-top:8px;color:#c0392b">清空所有数据</button>`);
  $('#ex-go').addEventListener('click', exportData);
  $('#im-go').addEventListener('click', importData);
  $('#reset-go').addEventListener('click', ()=>{ if(confirm('确定清空？此操作不可恢复。')){ localStorage.removeItem(STORE_KEY); state=freshState(); save(); closeModal(); render(); toast('已清空'); } });
});

render();

</script>
</body>
</html>
